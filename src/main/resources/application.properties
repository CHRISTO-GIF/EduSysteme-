spring.application.name=administration

# Port HTTP — Railway (et la plupart des hebergeurs) injectent la variable PORT
server.port=${PORT:8099}

# MySQL datasource — surchargeable par variables d'environnement en production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/holyflame_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Thymeleaf — cache actif par defaut (chaque requete reutilise le template deja
# compile au lieu de le re-parser depuis le disque) : sans ceci, le fichier de
# config etant partage entre le dev local et la prod, la prod tournait avec le
# cache desactive par defaut faute d'override explicite sur l'hebergeur.
# demarrer-application.bat positionne THYMELEAF_CACHE=false pour le hot-reload local.
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.encoding=UTF-8

# Logging — chemin relatif (fonctionne en local comme en conteneur) ; laisser
# LOG_FILE vide desactive l'ecriture fichier et ne garde que la console.
# WARN par defaut (DEBUG genere des traces detaillees sur chaque requete/rendu
# de template, cout CPU/IO reel) ; demarrer-application.bat repasse en DEBUG
# pour le dev local.
logging.file.name=${LOG_FILE:./app.log}
logging.level.org.thymeleaf=${LOG_LEVEL_THYMELEAF:WARN}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:WARN}

# File uploads
app.upload.dir=${APP_UPLOAD_DIR:./holyflame_uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Envoi d'email via l'API HTTP Brevo — vide en local = pas d'envoi reel, le lien s'affiche a l'ecran
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:noreply@edusysteme.local}
app.mail.from-name=${MAIL_FROM_NAME:EduSystem Pro}
# URL publique de l'application, utilisee pour construire les liens dans les emails
app.mail.base-url=${APP_BASE_URL:http://localhost:8099}
