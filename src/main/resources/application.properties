spring.application.name=administration

# Port HTTP — Railway (et la plupart des hebergeurs) injectent la variable PORT
server.port=${PORT:8099}

# MySQL datasource — surchargeable par variables d'environnement en production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/holyflame_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# Logging — chemin relatif (fonctionne en local comme en conteneur) ; laisser
# LOG_FILE vide desactive l'ecriture fichier et ne garde que la console.
logging.file.name=${LOG_FILE:./app.log}
logging.level.org.thymeleaf=${LOG_LEVEL_THYMELEAF:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:DEBUG}

# File uploads
app.upload.dir=${APP_UPLOAD_DIR:./holyflame_uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Envoi d'email (SMTP) — vide en local = pas d'envoi reel, le lien s'affiche a l'ecran
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:noreply@edusysteme.local}
app.mail.from-name=${MAIL_FROM_NAME:EduSystem Pro}
# URL publique de l'application, utilisee pour construire les liens dans les emails
app.mail.base-url=${APP_BASE_URL:http://localhost:8099}
