<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro - Budget Previsionnel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config" th:inline="javascript">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#90a8ff", "secondary": "#505f76", "on-tertiary-fixed": "#131b2e",
                        "primary-fixed-dim": "#b6c4ff", "on-error-container": "#93000a", "surface-container-highest": "#e0e3e5",
                        "secondary-fixed": "#d3e4fe", "primary-container": "#1e3a8a", "on-surface-variant": "#444651",
                        "surface-dim": "#d8dadc", "secondary-container": "#d0e1fb", "primary": "#00236f",
                        "on-background": "#191c1e", "outline-variant": "#c5c5d3", "error-container": "#ffdad6",
                        "primary-fixed": "#dce1ff", "on-primary": "#ffffff", "on-error": "#ffffff",
                        "surface-container-high": "#e6e8ea", "surface-container": "#eceef0", "surface": "#f7f9fb",
                        "outline": "#757682", "on-surface": "#191c1e", "on-secondary": "#ffffff",
                        "surface-container-low": "#f2f4f6", "on-secondary-container": "#54647a", "surface-bright": "#f7f9fb",
                        "tertiary-container": "#384055", "tertiary": [[${accentColor}]], "secondary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed": "#dae2fd", "on-tertiary-fixed-variant": "#3f465c", "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff", "on-tertiary-container": "#a4acc5", "tertiary-fixed-dim": "#bec6e0",
                        "background": "#f7f9fb", "on-primary-fixed-variant": "#264191", "error": "#ba1a1a",
                        "success-container": "#c8f7d4", "on-success-container": "#0a5c2b"
                    },
                    "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                    "spacing": {"xl": "32px", "base": "4px", "md": "16px", "sm": "8px", "xs": "4px", "lg": "24px", "container-max": "1440px", "sidebar-width": "260px", "gutter": "24px"},
                    "fontFamily": {"code": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"]}
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background text-on-surface">
<div class="flex h-screen overflow-hidden">
<div th:replace="~{fragments/sidebar-tresorier :: admin('budget')}"></div>
<main class="ml-0 md:ml-[260px] flex-1 flex flex-col h-screen bg-surface">
<header class="h-16 flex items-center justify-between px-md md:px-lg bg-surface border-b border-outline-variant sticky top-0 z-40">
<div class="flex items-center gap-sm">
<a class="text-secondary hover:text-primary transition-colors flex items-center gap-xs" th:href="@{/finances}">
<span class="material-symbols-outlined">arrow_back</span>
<span class="font-label-md text-label-md hidden sm:inline">Finances</span>
</a>
<span class="font-headline-sm text-headline-sm font-bold text-primary">Budget Previsionnel</span>
</div>
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary font-bold border-2 border-primary-fixed-dim" th:text="${utilisateurConnecte != null ? (#strings.isEmpty(utilisateurConnecte.prenom) ? '' : #strings.substring(utilisateurConnecte.prenom,0,1)) + (#strings.isEmpty(utilisateurConnecte.nom) ? '' : #strings.substring(utilisateurConnecte.nom,0,1)) : 'U'}">U</div>
</header>
<div class="flex-1 overflow-y-auto p-md md:p-lg space-y-lg max-w-container-max mx-auto w-full">

<div class="flex justify-between items-end flex-wrap gap-md">
<div>
<h2 class="font-headline-md text-headline-md text-primary">Budget Previsionnel</h2>
<p class="text-body-md text-secondary" th:text="'Previsions et realisations — annee ' + ${annee} + '.'">Apercu.</p>
</div>
<div class="flex items-center gap-lg">
<div class="text-right">
<p class="text-label-sm text-secondary uppercase tracking-wider">Solde prevu</p>
<p class="font-bold text-on-surface text-headline-sm" th:text="${#numbers.formatDecimal(soldePrevu, 0, 'COMMA', 0, 'POINT')} + ' F'">0 F</p>
</div>
<div class="text-right">
<p class="text-label-sm text-secondary uppercase tracking-wider">Solde reel</p>
<p class="font-bold text-headline-sm" th:classappend="${soldeReel >= 0} ? 'text-green-600' : 'text-error'" th:text="${#numbers.formatDecimal(soldeReel, 0, 'COMMA', 0, 'POINT')} + ' F'">0 F</p>
</div>
</div>
</div>

<div class="bg-white border border-outline-variant rounded-xl shadow-sm overflow-hidden">
<form class="grid grid-cols-2 md:grid-cols-6 gap-sm p-lg border-b border-outline-variant bg-surface-container-low items-end" method="post" th:action="@{/finances/budget}">
<input name="anneeScolaire" th:value="${annee}" type="hidden"/>
<div class="flex flex-col gap-xs col-span-2">
<label class="text-label-sm text-secondary">Designation</label>
<input class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="designation" required="required" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Categorie</label>
<select class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="categorie">
<option value="REVENU">Revenu</option>
<option value="DEPENSE">Depense</option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Type</label>
<select class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="typeLigne">
<option value="SCOLARITE">Scolarite</option>
<option value="INSCRIPTION">Inscription</option>
<option value="SALAIRE">Salaire</option>
<option value="CHARGES">Charges</option>
<option value="MATERIEL">Materiel</option>
<option value="SUBVENTION">Subvention</option>
<option value="AUTRE">Autre</option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Montant prevu</label>
<input class="rounded-lg border-outline-variant px-sm py-2 text-body-md" min="0" name="montantPrevu" required="required" step="1" type="number"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Mois</label>
<select class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="mois">
<option value="">Toute l'annee</option>
<option th:each="m : ${#numbers.sequence(1, 12)}" th:text="${m}" th:value="${m}"></option>
</select>
</div>
<button class="col-span-2 md:col-span-6 bg-primary text-on-primary px-lg py-2 rounded-lg font-label-md hover:opacity-90 transition-all flex items-center justify-center gap-xs" type="submit">
<span class="material-symbols-outlined text-[18px]">add</span> Ajouter une ligne budgetaire
</button>
</form>

<div class="overflow-x-auto hidden md:block">
<table class="w-full text-left border-collapse">
<thead class="bg-surface-container-low">
<tr>
<th class="px-lg py-md font-label-sm text-secondary uppercase tracking-wider">Designation</th>
<th class="px-lg py-md font-label-sm text-secondary uppercase tracking-wider">Categorie</th>
<th class="px-lg py-md font-label-sm text-secondary uppercase tracking-wider text-right">Prevu</th>
<th class="px-lg py-md font-label-sm text-secondary uppercase tracking-wider text-right">Reel</th>
<th class="px-lg py-md font-label-sm text-secondary uppercase tracking-wider text-right">Actions</th>
</tr>
</thead>
<tbody class="divide-y divide-outline-variant/30">
<tr th:each="l : ${lignes}">
<td class="px-lg py-md" th:text="${l.designation}"></td>
<td class="px-lg py-md">
<span class="text-label-sm px-sm py-xs rounded" th:classappend="${l.categorie == 'REVENU'} ? 'bg-primary/5 text-primary' : 'bg-error/5 text-error'" th:text="${l.categorie}"></span>
</td>
<td class="px-lg py-md text-right" th:text="${#numbers.formatDecimal(l.montantPrevu, 0, 'COMMA', 0, 'POINT')} + ' F'"></td>
<td class="px-lg py-md text-right" th:text="${l.montantReel != null ? #numbers.formatDecimal(l.montantReel, 0, 'COMMA', 0, 'POINT') + ' F' : '—'}"></td>
<td class="px-lg py-md text-right">
<div class="flex items-center justify-end gap-xs">
<form class="flex items-center gap-xs" method="post" th:action="@{/finances/budget/{id}/realiser(id=${l.id})}">
<input class="w-24 rounded-lg border-outline-variant px-sm py-1 text-body-md" min="0" name="montantReel" placeholder="Reel" step="1" th:value="${l.montantReel}" type="number"/>
<button class="p-1.5 text-primary hover:bg-primary/10 rounded-full transition-colors" title="Enregistrer le montant reel" type="submit">
<span class="material-symbols-outlined text-[18px]">check</span>
</button>
</form>
<form method="post" th:action="@{/finances/budget/{id}/supprimer(id=${l.id})}">
<button class="p-1.5 text-error hover:bg-error-container/30 rounded-full transition-colors" title="Supprimer" type="submit">
<span class="material-symbols-outlined text-[18px]">delete</span>
</button>
</form>
</div>
</td>
</tr>
<tr th:if="${lignes.isEmpty()}">
<td class="px-lg py-8 text-center text-secondary" colspan="5">Aucune ligne budgetaire pour cette annee.</td>
</tr>
</tbody>
</table>
</div>
<div class="md:hidden divide-y divide-outline-variant/30">
<p class="p-lg text-center text-secondary text-sm" th:if="${lignes.isEmpty()}">Aucune ligne budgetaire pour cette annee.</p>
<div class="p-md" th:each="l : ${lignes}">
<div class="flex justify-between items-start mb-xs">
<p class="font-medium text-sm" th:text="${l.designation}"></p>
<span class="text-label-sm px-sm py-xs rounded shrink-0" th:classappend="${l.categorie == 'REVENU'} ? 'bg-primary/5 text-primary' : 'bg-error/5 text-error'" th:text="${l.categorie}"></span>
</div>
<div class="flex items-center justify-between text-sm">
<span class="text-secondary" th:text="'Prevu: ' + ${#numbers.formatDecimal(l.montantPrevu, 0, 'COMMA', 0, 'POINT')} + ' F'"></span>
<span th:text="'Reel: ' + (${l.montantReel != null ? #numbers.formatDecimal(l.montantReel, 0, 'COMMA', 0, 'POINT') + ' F' : '—'})"></span>
</div>
<form class="mt-xs" method="post" th:action="@{/finances/budget/{id}/supprimer(id=${l.id})}">
<button class="text-error text-xs font-bold uppercase" type="submit">Supprimer</button>
</form>
</div>
</div>
</div>

</div>
</main>
</div>
</body>
</html>
