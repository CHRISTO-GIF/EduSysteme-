<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reinitialiser le mot de passe - EduSystem Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
<div class="w-full max-w-sm bg-white border border-[#e2e8f0] rounded-2xl shadow-sm p-6 sm:p-8">
<div class="flex flex-col items-center mb-8 text-center">
<div class="w-16 h-16 rounded-full bg-[#dce1ff] flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-[#00236f] text-[28px]" style="font-variation-settings: 'FILL' 1;">password</span>
</div>
<h1 class="text-xl font-bold text-[#00236f]">Nouveau mot de passe</h1>
</div>

<div th:if="${tokenInvalide}" class="space-y-4 text-center">
<div class="p-4 rounded-xl bg-[#ffdad6] text-[#93000a] text-sm">
    Ce lien de réinitialisation est invalide ou a expiré.
</div>
<a class="block bg-[#00236f] text-white font-semibold h-12 leading-[3rem] rounded-full hover:opacity-90 transition-all" href="/mot-de-passe-oublie">Demander un nouveau lien</a>
</div>

<form class="flex flex-col gap-5" method="post" th:action="@{/reinitialiser-mot-de-passe}" th:if="${tokenInvalide == null}">
<input name="token" th:value="${token}" type="hidden"/>
<div th:if="${erreur}" class="p-3 rounded-xl bg-[#ffdad6] text-[#93000a] text-sm" th:text="${erreur}"></div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-[#444651] ml-1" for="motDePasse">Nouveau mot de passe</label>
<div class="flex items-center gap-2 bg-[#f2f4f6] rounded-full pl-4 pr-2 focus-within:ring-2 focus-within:ring-[#00236f] transition-all">
<span class="material-symbols-outlined text-[#757682] text-[20px]">lock</span>
<input class="w-full h-12 bg-transparent border-none outline-none focus:ring-0 px-2" id="motDePasse" minlength="6" name="motDePasse" placeholder="Au moins 6 caractères" required="required" type="password"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-[#444651] ml-1" for="confirmationMotDePasse">Confirmer le mot de passe</label>
<div class="flex items-center gap-2 bg-[#f2f4f6] rounded-full pl-4 pr-2 focus-within:ring-2 focus-within:ring-[#00236f] transition-all">
<span class="material-symbols-outlined text-[#757682] text-[20px]">lock</span>
<input class="w-full h-12 bg-transparent border-none outline-none focus:ring-0 px-2" id="confirmationMotDePasse" minlength="6" name="confirmationMotDePasse" placeholder="Retapez le mot de passe" required="required" type="password"/>
</div>
</div>
<button class="mt-2 bg-[#00236f] text-white font-semibold h-12 rounded-full hover:opacity-90 active:scale-[0.98] transition-all" type="submit">Réinitialiser le mot de passe</button>
</form>
</div>
</body>
</html>
