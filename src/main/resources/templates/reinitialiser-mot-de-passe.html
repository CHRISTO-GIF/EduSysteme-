<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reinitialiser le mot de passe - EduSystem Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-md bg-white border border-[#e2e8f0] rounded-xl shadow-sm p-8">
<div class="flex flex-col items-center mb-8 text-center">
<span class="material-symbols-outlined text-[#00236f] text-[40px] mb-2" style="font-variation-settings: 'FILL' 1;">password</span>
<h1 class="text-2xl font-bold text-[#00236f]">Nouveau mot de passe</h1>
</div>

<div th:if="${tokenInvalide}" class="space-y-4 text-center">
<div class="p-4 rounded-lg bg-[#ffdad6] text-[#93000a] text-sm">
    Ce lien de reinitialisation est invalide ou a expire.
</div>
<a class="block text-sm text-[#00236f] font-semibold hover:underline" href="/mot-de-passe-oublie">Demander un nouveau lien</a>
</div>

<form class="flex flex-col gap-4" method="post" th:action="@{/reinitialiser-mot-de-passe}" th:if="${tokenInvalide == null}">
<input name="token" th:value="${token}" type="hidden"/>
<div th:if="${erreur}" class="p-3 rounded-lg bg-[#ffdad6] text-[#93000a] text-sm" th:text="${erreur}"></div>
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-[#444651]" for="motDePasse">Nouveau mot de passe</label>
<input class="w-full h-12 px-4 border border-[#c5c5d3] rounded-lg focus:ring-2 focus:ring-[#00236f] focus:border-[#00236f] transition-all" id="motDePasse" minlength="6" name="motDePasse" placeholder="Au moins 6 caracteres" required="required" type="password"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-[#444651]" for="confirmationMotDePasse">Confirmer le mot de passe</label>
<input class="w-full h-12 px-4 border border-[#c5c5d3] rounded-lg focus:ring-2 focus:ring-[#00236f] focus:border-[#00236f] transition-all" id="confirmationMotDePasse" minlength="6" name="confirmationMotDePasse" placeholder="Retapez le mot de passe" required="required" type="password"/>
</div>
<button class="mt-2 bg-[#00236f] text-white font-semibold h-12 rounded-lg hover:opacity-90 transition-all" type="submit">Reinitialiser le mot de passe</button>
</form>
</div>
</body>
</html>
