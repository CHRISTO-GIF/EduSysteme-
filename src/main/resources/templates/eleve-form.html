<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Modifier un eleve - EduSystem Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="bg-white border-b border-gray-200 px-4 md:px-8 py-4 flex items-center gap-3">
<a class="text-gray-500" href="/secretariat"><span class="material-symbols-outlined">arrow_back</span></a>
<h1 class="text-xl font-bold text-blue-900">Modifier l'eleve</h1>
</header>

<main class="max-w-2xl mx-auto px-4 md:px-8 py-4 md:py-8">
<div class="bg-white border border-gray-200 rounded-xl p-4 md:p-8">
<form class="space-y-4" method="post" th:action="@{/secretariat/eleves/{id}/modifier(id=${eleve.id})}">

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="text-xs text-gray-500 block mb-1">Matricule</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="matricule" required="required" th:value="${eleve.matricule}" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Date de naissance</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="dateNaissance" th:value="${eleve.dateNaissance}" type="date"/>
</div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="text-xs text-gray-500 block mb-1">Nom</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="nom" required="required" th:value="${eleve.nom}" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Prenom</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="prenom" required="required" th:value="${eleve.prenom}" type="text"/>
</div>
</div>

<div>
<label class="text-xs text-gray-500 block mb-1">Classe</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="classeId" required="required">
<option th:each="c : ${classes}" th:selected="${eleve.classe != null and eleve.classe.id == c.id}" th:text="${c.nom} + ' (' + ${c.niveau} + ')'" th:value="${c.id}"></option>
</select>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="text-xs text-gray-500 block mb-1">Telephone parent</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="telephoneParent" th:value="${eleve.telephoneParent}" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Email parent</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="emailParent" th:value="${eleve.emailParent}" type="email"/>
</div>
</div>

<div>
<label class="text-xs text-gray-500 block mb-1">Adresse</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="adresse" th:value="${eleve.adresse}" type="text"/>
</div>

<div>
<label class="text-xs text-gray-500 block mb-1">Statut d'inscription</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="statutInscription">
<option th:selected="${eleve.statutInscription == 'INSCRIT'}" value="INSCRIT">Inscrit</option>
<option th:selected="${eleve.statutInscription == 'EN_ATTENTE'}" value="EN_ATTENTE">En attente</option>
<option th:selected="${eleve.statutInscription == 'ABANDON'}" value="ABANDON">Abandon</option>
</select>
</div>

<div class="flex justify-end gap-3 pt-4">
<a class="px-5 py-2 border border-gray-300 rounded-lg" href="/secretariat">Annuler</a>
<button class="px-5 py-2 bg-blue-900 text-white rounded-lg font-medium" type="submit">Enregistrer</button>
</div>
</form>

<div class="mt-6 pt-6 border-t border-gray-200">
<h2 class="text-sm font-bold text-blue-900 mb-3">Compte portail de l'eleve</h2>

<div th:if="${eleve.compteEmail != null and !eleve.compteEmail.isBlank()}" class="space-y-3">
<p class="text-sm text-gray-600">Compte actif — connexion avec l'email <strong th:text="${eleve.compteEmail}"></strong>.</p>
<form class="flex flex-wrap items-end gap-3" method="post" th:action="@{/secretariat/eleves/{id}/reset-mdp(id=${eleve.id})}">
<div>
<label class="text-xs text-gray-500 block mb-1">Nouveau mot de passe</label>
<input class="p-2 border border-gray-300 rounded-lg" minlength="6" name="motDePasse" placeholder="6 caracteres minimum" required="required" type="text"/>
</div>
<button class="px-4 py-2 border border-gray-300 rounded-lg font-medium" type="submit">Reinitialiser le mot de passe</button>
</form>
</div>

<div th:if="${eleve.compteEmail == null or eleve.compteEmail.isBlank()}" class="space-y-3">
<p class="text-sm text-gray-600">Aucun compte portail n'a encore ete cree pour cet eleve. Renseignez un email et un mot de passe pour lui permettre de se connecter.</p>
<form class="flex flex-wrap items-end gap-3" method="post" th:action="@{/secretariat/eleves/{id}/creer-compte(id=${eleve.id})}">
<div>
<label class="text-xs text-gray-500 block mb-1">Email de connexion</label>
<input class="p-2 border border-gray-300 rounded-lg" name="email" required="required" th:value="${eleve.emailParent}" type="email"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Mot de passe</label>
<input class="p-2 border border-gray-300 rounded-lg" minlength="6" name="motDePasse" placeholder="6 caracteres minimum" required="required" type="text"/>
</div>
<button class="px-4 py-2 bg-blue-900 text-white rounded-lg font-medium" type="submit">Creer le compte</button>
</form>
</div>
</div>
</div>
</main>
</body>
</html>
