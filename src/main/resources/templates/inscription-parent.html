<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Creer mon compte Parent - EduSystem Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="text-gray-900 min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center p-md">
<div class="max-w-md w-full bg-white border border-gray-200 rounded-xl p-xl shadow-sm">
<div class="text-center mb-lg">
<span class="material-symbols-outlined text-blue-900 text-4xl mb-sm" style="font-variation-settings: 'FILL' 1;">family_restroom</span>
<h1 class="text-xl font-bold text-blue-900">Creer mon compte Parent</h1>
<p class="text-gray-500 text-sm mt-xs">Utilisez le code d'acces remis par l'etablissement lors de l'inscription de votre enfant.</p>
</div>

<div class="p-3 rounded-lg bg-red-100 text-red-800 text-sm mb-md" th:if="${erreur}" th:text="${erreur}"></div>
<div class="p-3 rounded-lg bg-green-100 text-green-800 text-sm mb-md" th:if="${succes}" th:text="${succes}"></div>

<form class="space-y-4" method="post" th:action="@{/inscription-parent}" th:if="${succes == null}">
<div>
<label class="text-xs text-gray-500 block mb-1">Code d'acces</label>
<input class="w-full p-2 border border-gray-300 rounded-lg uppercase" name="codeAcces" placeholder="Ex: A3K9QZX2" required="required" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Mot de passe</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" minlength="6" name="motDePasse" required="required" type="password"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Confirmer le mot de passe</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" minlength="6" name="confirmationMotDePasse" required="required" type="password"/>
</div>
<button class="w-full bg-blue-900 text-white py-2.5 rounded-lg font-medium hover:opacity-90 transition-opacity" type="submit">Creer mon compte</button>
</form>

<div class="pt-lg mt-lg border-t border-gray-200 text-center">
<a class="text-blue-900 font-medium hover:underline text-sm" href="/login">Retour a la connexion</a>
</div>
</div>
</main>
</body>
</html>
