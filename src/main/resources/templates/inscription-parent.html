<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Creer mon compte Parent - EduSystem Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="text-gray-900 min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center p-4 py-8">
<div class="max-w-sm w-full bg-white border border-gray-200 rounded-2xl p-6 sm:p-8 shadow-sm">
<div class="text-center mb-8">
<div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center mx-auto mb-3">
<span class="material-symbols-outlined text-blue-900 text-[28px]" style="font-variation-settings: 'FILL' 1;">family_restroom</span>
</div>
<h1 class="text-xl font-bold text-blue-900">Créer mon compte Parent</h1>
<p class="text-gray-500 text-sm mt-1">Utilisez le code d'accès remis par l'établissement lors de l'inscription de votre enfant.</p>
</div>

<div class="p-3 rounded-xl bg-red-100 text-red-800 text-sm mb-5" th:if="${erreur}" th:text="${erreur}"></div>
<div class="p-3 rounded-xl bg-green-100 text-green-800 text-sm mb-5" th:if="${succes}" th:text="${succes}"></div>

<form class="space-y-5" method="post" th:action="@{/inscription-parent}" th:if="${succes == null}">
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-gray-500 ml-1" for="codeAcces">Code d'accès</label>
<div class="flex items-center gap-2 bg-gray-100 rounded-full pl-4 pr-2 focus-within:ring-2 focus-within:ring-blue-900 transition-all">
<span class="material-symbols-outlined text-gray-400 text-[20px]">vpn_key</span>
<input class="w-full h-12 bg-transparent border-none outline-none focus:ring-0 px-2 uppercase" id="codeAcces" name="codeAcces" placeholder="Ex: A3K9QZX2" required="required" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-gray-500 ml-1" for="motDePasse">Mot de passe</label>
<div class="flex items-center gap-2 bg-gray-100 rounded-full pl-4 pr-2 focus-within:ring-2 focus-within:ring-blue-900 transition-all">
<span class="material-symbols-outlined text-gray-400 text-[20px]">lock</span>
<input class="w-full h-12 bg-transparent border-none outline-none focus:ring-0 px-2" id="motDePasse" minlength="6" name="motDePasse" required="required" type="password"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-gray-500 ml-1" for="confirmationMotDePasse">Confirmer le mot de passe</label>
<div class="flex items-center gap-2 bg-gray-100 rounded-full pl-4 pr-2 focus-within:ring-2 focus-within:ring-blue-900 transition-all">
<span class="material-symbols-outlined text-gray-400 text-[20px]">lock</span>
<input class="w-full h-12 bg-transparent border-none outline-none focus:ring-0 px-2" id="confirmationMotDePasse" minlength="6" name="confirmationMotDePasse" required="required" type="password"/>
</div>
</div>
<button class="w-full bg-blue-900 text-white h-12 rounded-full font-semibold hover:opacity-90 active:scale-[0.98] transition-all" type="submit">Créer mon compte</button>
</form>

<div class="pt-6 mt-6 border-t border-gray-200 text-center">
<a class="text-blue-900 font-medium hover:underline text-sm" href="/login">Retour à la connexion</a>
</div>
</div>
</main>
</body>
</html>
