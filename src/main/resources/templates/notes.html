<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notes - EduSystem Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
<div>
<h1 class="text-xl font-bold text-blue-900">Notes</h1>
<p class="text-gray-500 text-sm">Liste complete des notes saisies.</p>
</div>
<div class="flex gap-2">
<a class="border border-gray-300 px-4 py-2 rounded-lg font-medium flex items-center gap-2" href="/notes/saisie">
<span class="material-symbols-outlined text-[18px]">edit_note</span> Saisie rapide
</a>
<button class="bg-blue-900 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2" onclick="document.getElementById('modal-note').classList.remove('hidden')" type="button">
<span class="material-symbols-outlined text-[18px]">add</span> Ajouter une note
</button>
</div>
</header>

<main class="max-w-6xl mx-auto px-8 py-8">

<div th:if="${erreurAuth}" class="mb-lg p-md rounded-lg bg-red-100 text-red-800 font-medium" th:text="${erreurAuth}"></div>

<form class="bg-white border border-gray-200 rounded-xl p-lg mb-lg flex items-end gap-md" method="get">
<div>
<label class="text-xs text-gray-500 block mb-1">Trimestre</label>
<select class="p-2 border border-gray-300 rounded-lg" name="trimestre" onchange="this.form.submit()">
<option value="">Tous</option>
<option th:selected="${trimestreFiltre == 1}" value="1">Trimestre 1</option>
<option th:selected="${trimestreFiltre == 2}" value="2">Trimestre 2</option>
<option th:selected="${trimestreFiltre == 3}" value="3">Trimestre 3</option>
</select>
</div>
</form>

<div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
<table class="w-full text-left text-sm">
<thead class="bg-gray-50 text-gray-500 uppercase text-xs">
<tr><th class="px-5 py-3">Eleve</th><th class="px-5 py-3">Matiere</th><th class="px-5 py-3">Type</th><th class="px-5 py-3">Trim.</th><th class="px-5 py-3">Note</th><th class="px-5 py-3">Date</th><th class="px-5 py-3">Statut</th><th class="px-5 py-3 text-right">Actions</th></tr>
</thead>
<tbody class="divide-y divide-gray-100">
<tr th:if="${notes.isEmpty()}">
<td class="px-5 py-8 text-center text-gray-500" colspan="8">Aucune note enregistree.</td>
</tr>
<tr th:each="n : ${notes}">
<td class="px-5 py-3 font-medium" th:text="${n.eleve != null ? n.eleve.prenom + ' ' + n.eleve.nom : '?'}">Eleve</td>
<td class="px-5 py-3" th:text="${n.matiere != null ? n.matiere.nom : '?'}">Matiere</td>
<td class="px-5 py-3 text-gray-500" th:text="${n.type}">Type</td>
<td class="px-5 py-3" th:text="${n.trimestre}">1</td>
<td class="px-5 py-3 font-bold text-blue-900" th:text="${n.valeur} + '/20'">--</td>
<td class="px-5 py-3 text-gray-500" th:text="${n.dateEvaluation != null ? #temporals.format(n.dateEvaluation, 'dd/MM/yyyy') : '--'}">--</td>
<td class="px-5 py-3">
<span class="px-2 py-0.5 rounded-full text-xs font-medium" th:classappend="${n.statut == 'PUBLIE'} ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'" th:text="${n.statut}">Statut</span>
</td>
<td class="px-5 py-3 text-right">
<form method="post" th:action="@{/notes/{id}/supprimer(id=${n.id})}" onsubmit="return confirm('Supprimer cette note ?');">
<button class="text-red-600 hover:underline text-xs" type="submit">Supprimer</button>
</form>
</td>
</tr>
</tbody>
</table>
</div>

</main>

<div class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-lg" id="modal-note">
<div class="bg-white rounded-xl p-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
<div class="flex justify-between items-center mb-lg">
<h3 class="font-bold text-lg">Ajouter une note</h3>
<button onclick="document.getElementById('modal-note').classList.add('hidden')" type="button"><span class="material-symbols-outlined">close</span></button>
</div>
<form class="space-y-3" method="post" th:action="@{/notes}">
<div>
<label class="text-xs text-gray-500 block mb-1">Eleve</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="eleveId" required="required">
<option th:each="e : ${eleves}" th:text="${e.nom} + ' ' + ${e.prenom} + ' (' + ${e.matricule} + ')'" th:value="${e.id}"></option>
</select>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Matiere</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="matiereId" required="required">
<option th:each="m : ${matieres}" th:text="${m.nom}" th:value="${m.id}"></option>
</select>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-xs text-gray-500 block mb-1">Note (/20)</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" max="20" min="0" name="valeur" required="required" step="0.25" type="number"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Coefficient</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" min="0" name="coefficient" step="0.5" type="number"/>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-xs text-gray-500 block mb-1">Type</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="type">
<option value="DEVOIR">Devoir</option>
<option value="EXAMEN">Examen</option>
<option value="PARTICIPATION">Participation</option>
</select>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Trimestre</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="trimestre">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</div>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Date d'evaluation</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="dateEvaluation" type="date"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Commentaire</label>
<textarea class="w-full p-2 border border-gray-300 rounded-lg" name="commentaire" rows="2"></textarea>
</div>
<div class="flex justify-end gap-2 pt-2">
<button class="px-4 py-2 border border-gray-300 rounded-lg" onclick="document.getElementById('modal-note').classList.add('hidden')" type="button">Annuler</button>
<button class="px-4 py-2 bg-blue-900 text-white rounded-lg" type="submit">Enregistrer</button>
</div>
</form>
</div>
</div>
</body>
</html>
