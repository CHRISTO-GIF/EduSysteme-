<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro - Inscription Eleve - Etape 5</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<script id="tailwind-config" th:inline="javascript">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#0b1c30", "secondary": "#505f76", "on-error": "#ffffff",
                        "surface-tint": "#4059aa", "on-surface-variant": "#444651", "surface": "#f7f9fb",
                        "on-primary-fixed-variant": "#264191", "outline-variant": "#c5c5d3", "primary-container": "#1e3a8a",
                        "on-surface": "#191c1e", "inverse-on-surface": "#eff1f3", "error-container": "#ffdad6",
                        "inverse-primary": "#b6c4ff", "tertiary-fixed-dim": "#bec6e0", "surface-bright": "#f7f9fb",
                        "secondary-fixed": "#d3e4fe", "on-secondary": "#ffffff", "on-primary-fixed": "#00164e",
                        "surface-container": "#eceef0", "on-tertiary-fixed-variant": "#3f465c", "surface-variant": "#e0e3e5",
                        "surface-dim": "#d8dadc", "surface-container-high": "#e6e8ea", "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a", "tertiary": [[${accentColor}]], "surface-container-low": "#f2f4f6",
                        "on-primary-container": "#90a8ff", "inverse-surface": "#2d3133", "primary-fixed-dim": "#b6c4ff",
                        "outline": "#757682", "on-primary": "#ffffff", "secondary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed-variant": "#38485d", "primary": "#00236f", "on-error-container": "#93000a",
                        "primary-fixed": "#dce1ff", "tertiary-fixed": "#dae2fd", "on-tertiary": "#ffffff",
                        "tertiary-container": "#384055", "surface-container-highest": "#e0e3e5", "background": "#f7f9fb",
                        "secondary-container": "#d0e1fb", "on-secondary-container": "#54647a", "on-tertiary-fixed": "#131b2e",
                        "on-tertiary-container": "#a4acc5", "on-background": "#191c1e"
                    },
                    "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                    "spacing": {"base": "4px", "xl": "32px", "sidebar-width": "260px", "gutter": "24px", "container-max": "1440px", "xs": "4px", "md": "16px", "sm": "8px", "lg": "24px"},
                    "fontFamily": {"headline-lg": ["Inter"], "headline-md": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"]},
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-sm": ["18px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { background-color: #f7f9fb; font-family: 'Inter', sans-serif; }
        .step-active { position: relative; }
        .step-active::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background-color: #00236f; border-radius: 0 4px 4px 0; }
        .drop-zone:hover { border-color: #00236f; background-color: #f2f4f6; }
        .drop-zone.has-file { border-color: #00236f; background-color: #f2f4f6; }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col">
<div th:replace="~{fragments/eleve-wizard-sidebar :: topbar}"></div>
<div th:replace="~{fragments/eleve-wizard-sidebar :: mobile-progress(5, 'Pieces Justificatives')}"></div>
<main class="flex flex-1 overflow-hidden">
<div th:replace="~{fragments/eleve-wizard-sidebar :: sidebar(5)}"></div>
<section class="flex-1 overflow-y-auto p-lg md:p-xl flex justify-center">
<div class="w-full max-w-4xl">
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Pieces Justificatives</h1>
<p class="font-body-md text-body-md text-secondary">Veuillez televerser les documents originaux pour finaliser l'inscription de l'eleve.</p>
</div>

<div class="mb-lg p-md rounded-lg bg-error-container text-on-error-container font-body-md text-body-md flex items-center gap-sm" id="erreur-finalisation" th:if="${erreur}">
<span class="material-symbols-outlined">error</span>
<span th:text="${erreur}"></span>
</div>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg md:p-xl">
<form class="space-y-xl" enctype="multipart/form-data" method="post" th:action="@{/secretariat/eleves/nouveau/etape-5/finaliser}">

<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-sm">
<label class="font-label-md text-on-surface">Acte de Naissance <span class="text-error">*</span></label>
<label class="drop-zone border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm transition-all bg-surface-container-lowest cursor-pointer group h-48" for="acteNaissance">
<span class="material-symbols-outlined text-headline-lg text-outline group-hover:text-primary transition-colors">description</span>
<div class="text-center">
<p class="font-label-md text-primary js-filename">Cliquer pour uploader</p>
<p class="font-label-sm text-outline">ou glisser-depose</p>
</div>
</label>
<input accept=".pdf,.jpg,.jpeg,.png" class="hidden" id="acteNaissance" name="acteNaissance" type="file"/>
</div>

<div class="flex flex-col gap-sm">
<label class="font-label-md text-on-surface">Certificat de Scolarite precedent</label>
<label class="drop-zone border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm transition-all bg-surface-container-lowest cursor-pointer group h-48" for="certificatScolarite">
<span class="material-symbols-outlined text-headline-lg text-outline group-hover:text-primary transition-colors">history_edu</span>
<div class="text-center">
<p class="font-label-md text-primary js-filename">Cliquer pour uploader</p>
<p class="font-label-sm text-outline">ou glisser-depose</p>
</div>
</label>
<input accept=".pdf,.jpg,.jpeg,.png" class="hidden" id="certificatScolarite" name="certificatScolarite" type="file"/>
</div>

<div class="flex flex-col gap-sm">
<label class="font-label-md text-on-surface">Photos d'identite supplementaires (x4)</label>
<label class="drop-zone border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm transition-all bg-surface-container-lowest cursor-pointer group h-48" for="photosIdentite">
<span class="material-symbols-outlined text-headline-lg text-outline group-hover:text-primary transition-colors">account_circle</span>
<div class="text-center">
<p class="font-label-md text-primary js-filename">Cliquer pour uploader</p>
<p class="font-label-sm text-outline">Formats portrait uniquement</p>
</div>
</label>
<input accept=".jpg,.jpeg,.png" class="hidden" id="photosIdentite" multiple="multiple" name="photosIdentite" type="file"/>
</div>

<div class="flex flex-col gap-sm">
<label class="font-label-md text-on-surface">Dossier Medical &amp; Carnet de Sante</label>
<label class="drop-zone border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm transition-all bg-surface-container-lowest cursor-pointer group h-48" for="dossierMedical">
<span class="material-symbols-outlined text-headline-lg text-outline group-hover:text-primary transition-colors">medical_services</span>
<div class="text-center">
<p class="font-label-md text-primary js-filename">Cliquer pour uploader</p>
<p class="font-label-sm text-outline">Confidentialite garantie</p>
</div>
</label>
<input accept=".pdf,.jpg,.jpeg,.png" class="hidden" id="dossierMedical" name="dossierMedical" type="file"/>
</div>
</div>

<div class="bg-surface-container-low p-lg rounded-xl border border-outline-variant">
<h4 class="font-label-md text-on-surface mb-md">Verifications finales</h4>
<div class="space-y-sm">
<label class="flex items-center gap-md cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20" name="certifieAuthentique" required="required" type="checkbox" value="true"/>
<span class="font-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Je certifie que tous les documents fournis sont authentiques.</span>
</label>
<label class="flex items-center gap-md cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20" name="accepteTraitementSante" required="required" type="checkbox" value="true"/>
<span class="font-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">J'accepte le traitement des donnees de sante dans le cadre scolaire.</span>
</label>
</div>
</div>

<div class="flex items-center justify-between pt-lg border-t border-outline-variant">
<a class="px-xl py-md font-label-md text-secondary border border-outline rounded-lg hover:bg-surface-container transition-all flex items-center gap-sm" th:href="@{/secretariat/eleves/nouveau/etape-4}">
<span class="material-symbols-outlined text-body-md">arrow_back</span> Precedent
</a>
<button class="px-xl py-md font-label-md bg-primary text-on-primary rounded-lg hover:opacity-90 shadow-md shadow-primary/10 transition-all flex items-center gap-sm" type="submit">
Enregistrer l'inscription <span class="material-symbols-outlined text-body-md">check_circle</span>
</button>
</div>
</form>
</div>
</div>
</section>
</main>
<script>
        document.querySelectorAll('input[type=file]').forEach(function (input) {
            input.addEventListener('change', function () {
                var zone = document.querySelector('label[for="' + input.id + '"]');
                var label = zone.querySelector('.js-filename');
                if (input.files.length === 1) {
                    label.textContent = input.files[0].name;
                } else if (input.files.length > 1) {
                    label.textContent = input.files.length + ' fichiers selectionnes';
                } else {
                    label.textContent = 'Cliquer pour uploader';
                }
                zone.classList.toggle('has-file', input.files.length > 0);
            });
        });

        var erreurFinalisation = document.getElementById('erreur-finalisation');
        if (erreurFinalisation) {
            erreurFinalisation.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
