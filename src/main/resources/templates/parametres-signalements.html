<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Signalements | EduSystem Pro</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<script id="tailwind-config" th:inline="javascript">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-bright": "#f7f9fb", "background": "#f7f9fb", "on-primary": "#ffffff",
            "error": "#ba1a1a", "tertiary-container": "#384055", "on-tertiary-container": "#a4acc5",
            "error-container": "#ffdad6", "primary-fixed": "#dce1ff", "on-surface": "#191c1e",
            "outline": "#757682", "primary-fixed-dim": "#b6c4ff", "surface-container-lowest": "#ffffff",
            "outline-variant": "#c5c5d3", "primary": "#00236f", "secondary-fixed-dim": "#b7c8e1",
            "on-error": "#ffffff", "on-error-container": "#93000a", "on-secondary-container": "#54647a",
            "surface-container": "#eceef0", "on-background": "#191c1e", "on-primary-container": "#90a8ff",
            "on-surface-variant": "#444651", "secondary-container": "#d0e1fb", "primary-container": "#1e3a8a",
            "surface-container-high": "#e6e8ea", "tertiary": [[${accentColor}]], "surface": "#f7f9fb",
            "secondary": "#505f76", "secondary-fixed": "#d3e4fe", "surface-container-low": "#f2f4f6",
            "surface-dim": "#d8dadc", "success-container": "#c8f7d4", "on-success-container": "#0a5c2b"
          },
          "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          "spacing": {"xs": "4px", "gutter": "24px", "xl": "32px", "lg": "24px", "sm": "8px", "md": "16px", "base": "4px", "sidebar-width": "260px", "container-max": "1440px"},
          "fontFamily": {"headline-md": ["Inter"], "headline-lg": ["Inter"], "label-md": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"]}
        }
      }
    }
</script>
</head>
<body class="bg-background text-on-background antialiased">
<div th:replace="~{fragments/sidebar-admin :: admin('parametres')}"></div>

<main class="ml-sidebar-width p-xl">
<div class="max-w-container-max mx-auto">

<div class="mb-xl flex justify-between items-end flex-wrap gap-md">
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Signalements de la messagerie</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Problemes signales par les parents depuis le portail parent.</p>
</div>
<div class="px-lg py-md bg-surface-container-lowest border border-outline-variant rounded-xl text-center">
<p class="text-[10px] text-outline uppercase tracking-wider">Ouverts</p>
<p class="font-headline-md text-headline-md text-error" th:text="${nbOuverts}">0</p>
</div>
</div>

<div th:if="${successMsg}" class="mb-lg p-md rounded-lg bg-success-container text-on-success-container font-body-md text-body-md" th:text="${successMsg}"></div>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
<table class="w-full text-left">
<thead class="bg-surface-container-low">
<tr>
<th class="p-md font-label-sm text-label-sm text-on-surface-variant uppercase">Signale par</th>
<th class="p-md font-label-sm text-label-sm text-on-surface-variant uppercase">Concernant</th>
<th class="p-md font-label-sm text-label-sm text-on-surface-variant uppercase">Motif</th>
<th class="p-md font-label-sm text-label-sm text-on-surface-variant uppercase">Description</th>
<th class="p-md font-label-sm text-label-sm text-on-surface-variant uppercase">Date</th>
<th class="p-md font-label-sm text-label-sm text-on-surface-variant uppercase">Statut</th>
<th class="p-md font-label-sm text-label-sm text-on-surface-variant uppercase">Action</th>
</tr>
</thead>
<tbody>
<tr th:if="${signalements.isEmpty()}">
<td class="p-lg text-center text-on-surface-variant" colspan="7">Aucun signalement pour le moment.</td>
</tr>
<tr class="border-t border-outline-variant" th:each="s : ${signalements}">
<td class="p-md font-body-md text-body-md" th:text="${s.signalePar}">parent@mail.com</td>
<td class="p-md font-body-md text-body-md" th:text="${s.concernant}">contact@mail.com</td>
<td class="p-md font-body-md text-body-md" th:text="${s.motif}">Motif</td>
<td class="p-md font-body-md text-body-md max-w-[280px] truncate" th:text="${s.description}">Description</td>
<td class="p-md font-body-md text-body-md" th:text="${#temporals.format(s.dateSignalement, 'dd/MM/yyyy HH:mm')}">--</td>
<td class="p-md">
<span class="px-sm py-1 rounded font-label-sm text-label-sm"
      th:classappend="${s.statut == 'OUVERT'} ? 'bg-error-container text-on-error-container' : 'bg-success-container text-on-success-container'"
      th:text="${s.statut}">OUVERT</span>
</td>
<td class="p-md">
<form th:if="${s.statut == 'OUVERT'}" method="post" th:action="@{/parametres/signalements/{id}/traiter(id=${s.id})}">
<button class="px-md py-1 border border-outline-variant rounded font-label-sm text-label-sm hover:bg-surface-container-high transition-colors" type="submit">Marquer traite</button>
</form>
</td>
</tr>
</tbody>
</table>
</div>

</div>
</main>
</body>
</html>
