<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title th:text="${(titre ?: 'Suppression impossible') + ' - EduSystem Pro'}">Suppression impossible - EduSystem Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center">
<div class="max-w-md w-full bg-white border border-gray-200 rounded-xl p-xl text-center">
<span class="material-symbols-outlined text-red-600 text-[56px] mb-md">error</span>
<h1 class="text-xl font-bold text-gray-900 mb-sm" th:text="${titre ?: 'Suppression impossible'}">Suppression impossible</h1>
<p class="text-gray-500 mb-lg" th:text="${detail}">Une contrainte de base de donnees empeche cette suppression.</p>
<a class="inline-flex items-center gap-xs px-lg py-2 bg-blue-900 text-white rounded-lg font-medium" th:href="${retourUrl}">
<span class="material-symbols-outlined text-[18px]">arrow_back</span> Retour
</a>
</div>
</body>
</html>
