<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro - Nouvelle fiche de controle</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<script id="tailwind-config" th:inline="javascript">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#90a8ff", "secondary": "#505f76", "on-tertiary-fixed": "#131b2e",
                        "primary-fixed-dim": "#b6c4ff", "on-error-container": "#93000a", "surface-container-highest": "#e0e3e5",
                        "secondary-fixed": "#d3e4fe", "primary-container": "#1e3a8a", "on-surface-variant": "#444651",
                        "surface-dim": "#d8dadc", "secondary-container": "#d0e1fb", "primary": "#00236f",
                        "on-background": "#191c1e", "outline-variant": "#c5c5d3", "error-container": "#ffdad6",
                        "primary-fixed": "#dce1ff", "on-primary": "#ffffff", "on-error": "#ffffff",
                        "surface-container-high": "#e6e8ea", "surface-container": "#eceef0", "surface": "#f7f9fb",
                        "outline": "#757682", "on-surface": "#191c1e", "on-secondary": "#ffffff",
                        "surface-container-low": "#f2f4f6", "on-secondary-container": "#54647a", "surface-bright": "#f7f9fb",
                        "tertiary-container": "#384055", "tertiary": [[${accentColor}]], "secondary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed": "#dae2fd", "on-tertiary-fixed-variant": "#3f465c", "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff", "on-tertiary-container": "#a4acc5", "tertiary-fixed-dim": "#bec6e0",
                        "background": "#f7f9fb", "on-primary-fixed-variant": "#264191", "error": "#ba1a1a",
                        "success-container": "#c8f7d4", "on-success-container": "#0a5c2b"
                    },
                    "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                    "spacing": {"xl": "32px", "base": "4px", "md": "16px", "sm": "8px", "xs": "4px", "lg": "24px", "container-max": "1440px", "sidebar-width": "260px", "gutter": "24px"},
                    "fontFamily": {"code": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"]}
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background text-on-surface">
<div class="flex h-screen overflow-hidden">
<div th:replace="~{fragments/sidebar-coordination :: admin('coordination')}"></div>
<main class="ml-0 md:ml-[260px] flex-1 flex flex-col h-screen bg-surface">
<header class="h-16 flex items-center gap-sm px-md md:px-lg bg-surface border-b border-outline-variant sticky top-0 z-40">
<a class="text-secondary hover:text-primary transition-colors flex items-center gap-xs" th:href="@{/coordination}">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<span class="font-headline-sm text-headline-sm font-bold text-primary">Nouvelle fiche de controle</span>
</header>
<div class="flex-1 overflow-y-auto p-md md:p-lg max-w-container-max mx-auto w-full">

<form class="space-y-lg" method="post" th:action="@{/coordination}">

<div class="bg-white border border-outline-variant rounded-xl shadow-sm p-lg">
<h4 class="font-headline-sm text-on-surface mb-md">Ecole primaire Holy Flame</h4>
<div class="grid grid-cols-1 md:grid-cols-5 gap-md">
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Classe</label>
<select class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="classeId">
<option value="">—</option>
<option th:each="c : ${classes}" th:text="${c.nom} + ' (' + ${c.niveau} + ')'" th:value="${c.id}"></option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Enseignant</label>
<select class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="enseignantId">
<option value="">—</option>
<option th:each="e : ${enseignants}" th:text="${e.nom} + ' ' + ${e.prenom}" th:value="${e.id}"></option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Cours</label>
<input class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="cours" placeholder="Ex: Mathematiques" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Effectifs</label>
<input class="rounded-lg border-outline-variant px-sm py-2 text-body-md" min="0" name="effectifs" type="number"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm text-secondary">Date de la visite</label>
<input class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="dateVisite" required="required" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" type="date"/>
</div>
</div>
</div>

<div class="bg-white border border-outline-variant rounded-xl shadow-sm overflow-hidden" th:each="section : ${sections}">
<div class="p-md bg-surface-container-low border-b border-outline-variant font-headline-sm text-on-surface" th:text="${section}"></div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead class="bg-surface-container-low">
<tr>
<th class="px-lg py-sm font-label-sm text-secondary uppercase tracking-wider w-1/3">Critere</th>
<th class="px-lg py-sm font-label-sm text-secondary uppercase tracking-wider">Appreciation</th>
<th class="px-lg py-sm font-label-sm text-secondary uppercase tracking-wider">Conseils</th>
</tr>
</thead>
<tbody class="divide-y divide-outline-variant/30">
<tr th:each="c, iter : ${criteres}" th:if="${c.section == section}">
<td class="px-lg py-sm text-body-md" th:text="${c.libelle}"></td>
<td class="px-lg py-sm">
<input class="w-full rounded-lg border-outline-variant px-sm py-1.5 text-body-md" th:name="'appreciation_' + ${iter.index}" type="text"/>
</td>
<td class="px-lg py-sm">
<input class="w-full rounded-lg border-outline-variant px-sm py-1.5 text-body-md" th:name="'conseils_' + ${iter.index}" type="text"/>
</td>
</tr>
</tbody>
</table>
</div>
</div>

<div class="bg-white border border-outline-variant rounded-xl shadow-sm p-lg">
<h4 class="font-headline-sm text-on-surface mb-md">Evaluation</h4>
<div class="flex flex-col gap-xs mb-md max-w-xs">
<label class="text-label-sm text-secondary">Note globale de la visite</label>
<select class="rounded-lg border-outline-variant px-sm py-2 text-body-md" name="noteGlobale" required="required">
<option value="">—</option>
<option value="INSUFFISANT">Insuffisant</option>
<option value="MOYEN">Moyen</option>
<option value="BIEN">Bien</option>
<option value="TRES_BIEN">Tres bien</option>
</select>
<p class="text-label-sm text-secondary">Sert a suivre l'evolution de cet enseignant visite apres visite.</p>
</div>
<textarea class="w-full rounded-lg border-outline-variant px-sm py-2 text-body-md" name="evaluationGlobale" placeholder="Appreciation generale de la visite, recommandations..." rows="4"></textarea>
</div>

<div class="flex justify-end pb-lg">
<button class="bg-primary text-on-primary px-xl py-sm rounded-lg font-label-md hover:opacity-90 transition-all flex items-center gap-xs shadow-sm" type="submit">
<span class="material-symbols-outlined text-[18px]">check</span>
Enregistrer la fiche
</button>
</div>

</form>
</div>
</main>
</div>
</body>
</html>
