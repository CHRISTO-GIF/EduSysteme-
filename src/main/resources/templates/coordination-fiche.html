<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro - Fiche de controle</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<script id="tailwind-config" th:inline="javascript">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#90a8ff", "secondary": "#505f76", "on-tertiary-fixed": "#131b2e",
                        "primary-fixed-dim": "#b6c4ff", "on-error-container": "#93000a", "surface-container-highest": "#e0e3e5",
                        "secondary-fixed": "#d3e4fe", "primary-container": "#1e3a8a", "on-surface-variant": "#444651",
                        "surface-dim": "#d8dadc", "secondary-container": "#d0e1fb", "primary": "#00236f",
                        "on-background": "#191c1e", "outline-variant": "#c5c5d3", "error-container": "#ffdad6",
                        "primary-fixed": "#dce1ff", "on-primary": "#ffffff", "on-error": "#ffffff",
                        "surface-container-high": "#e6e8ea", "surface-container": "#eceef0", "surface": "#f7f9fb",
                        "outline": "#757682", "on-surface": "#191c1e", "on-secondary": "#ffffff",
                        "surface-container-low": "#f2f4f6", "on-secondary-container": "#54647a", "surface-bright": "#f7f9fb",
                        "tertiary-container": "#384055", "tertiary": [[${accentColor}]], "secondary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed": "#dae2fd", "on-tertiary-fixed-variant": "#3f465c", "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff", "on-tertiary-container": "#a4acc5", "tertiary-fixed-dim": "#bec6e0",
                        "background": "#f7f9fb", "on-primary-fixed-variant": "#264191", "error": "#ba1a1a",
                        "success-container": "#c8f7d4", "on-success-container": "#0a5c2b"
                    },
                    "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                    "spacing": {"xl": "32px", "base": "4px", "md": "16px", "sm": "8px", "xs": "4px", "lg": "24px", "container-max": "1440px", "sidebar-width": "260px", "gutter": "24px"},
                    "fontFamily": {"code": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"]}
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        @media print { .no-print { display: none !important; } main { margin-left: 0 !important; } }
    </style>
</head>
<body class="bg-background text-on-surface">
<div class="flex h-screen overflow-hidden">
<div class="no-print" th:replace="~{fragments/sidebar-coordination :: admin('coordination')}"></div>
<main class="ml-0 md:ml-[260px] flex-1 flex flex-col h-screen bg-surface overflow-y-auto">
<header class="no-print h-16 flex items-center justify-between gap-sm px-md md:px-lg bg-surface border-b border-outline-variant sticky top-0 z-40">
<div class="flex items-center gap-sm">
<a class="text-secondary hover:text-primary transition-colors flex items-center gap-xs" th:href="@{/coordination}">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<span class="font-headline-sm text-headline-sm font-bold text-primary">Fiche de controle</span>
</div>
<div class="flex items-center gap-sm">
<button class="px-md py-sm border border-outline-variant rounded-lg font-label-md flex items-center gap-xs" onclick="window.print()" type="button">
<span class="material-symbols-outlined text-[18px]">print</span> Imprimer
</button>
<form method="post" th:action="@{/coordination/{id}/supprimer(id=${fiche.id})}" onsubmit="return confirm('Supprimer cette fiche ? Cette action est irreversible.');">
<button class="px-md py-sm border border-error text-error rounded-lg font-label-md flex items-center gap-xs" type="submit">
<span class="material-symbols-outlined text-[18px]">delete</span> Supprimer
</button>
</form>
</div>
</header>
<div class="p-md md:p-lg space-y-lg max-w-container-max mx-auto w-full">

<div class="bg-white border border-outline-variant rounded-xl shadow-sm p-lg">
<h4 class="font-headline-sm text-primary mb-md">Ecole primaire Holy Flame — Fiche individuelle de controle</h4>
<div class="grid grid-cols-2 md:grid-cols-5 gap-md text-body-md">
<div><p class="text-label-sm text-secondary uppercase">Date</p><p class="font-medium" th:text="${#temporals.format(fiche.dateVisite, 'dd MMMM yyyy')}"></p></div>
<div><p class="text-label-sm text-secondary uppercase">Classe</p><p class="font-medium" th:text="${fiche.classe != null ? fiche.classe.nom : '—'}"></p></div>
<div><p class="text-label-sm text-secondary uppercase">Enseignant</p><p class="font-medium" th:text="${fiche.enseignant != null ? fiche.enseignant.nom + ' ' + fiche.enseignant.prenom : '—'}"></p></div>
<div><p class="text-label-sm text-secondary uppercase">Cours</p><p class="font-medium" th:text="${fiche.cours}"></p></div>
<div><p class="text-label-sm text-secondary uppercase">Effectifs</p><p class="font-medium" th:text="${fiche.effectifs}"></p></div>
<div><p class="text-label-sm text-secondary uppercase">Note globale</p>
<span class="px-sm py-xs rounded-full text-label-sm font-bold bg-red-50 text-red-700" th:if="${fiche.noteGlobale == 'INSUFFISANT'}">Insuffisant</span>
<span class="px-sm py-xs rounded-full text-label-sm font-bold bg-amber-50 text-amber-700" th:if="${fiche.noteGlobale == 'MOYEN'}">Moyen</span>
<span class="px-sm py-xs rounded-full text-label-sm font-bold bg-blue-50 text-blue-700" th:if="${fiche.noteGlobale == 'BIEN'}">Bien</span>
<span class="px-sm py-xs rounded-full text-label-sm font-bold bg-green-50 text-green-700" th:if="${fiche.noteGlobale == 'TRES_BIEN'}">Tres bien</span>
</div>
</div>
</div>

<div class="bg-white border border-outline-variant rounded-xl shadow-sm overflow-hidden" th:each="entry : ${reponsesParSection}">
<div class="p-md bg-surface-container-low border-b border-outline-variant font-headline-sm text-on-surface" th:text="${entry.key}"></div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead class="bg-surface-container-low">
<tr>
<th class="px-lg py-sm font-label-sm text-secondary uppercase tracking-wider w-1/3">Critere</th>
<th class="px-lg py-sm font-label-sm text-secondary uppercase tracking-wider">Appreciation</th>
<th class="px-lg py-sm font-label-sm text-secondary uppercase tracking-wider">Conseils</th>
</tr>
</thead>
<tbody class="divide-y divide-outline-variant/30">
<tr th:each="r : ${entry.value}">
<td class="px-lg py-sm text-body-md" th:text="${r.critere}"></td>
<td class="px-lg py-sm text-secondary" th:text="${r.appreciation}"></td>
<td class="px-lg py-sm text-secondary" th:text="${r.conseils}"></td>
</tr>
</tbody>
</table>
</div>
</div>

<div class="bg-white border border-outline-variant rounded-xl shadow-sm p-lg" th:if="${fiche.evaluationGlobale != null and !fiche.evaluationGlobale.isEmpty()}">
<h4 class="font-headline-sm text-on-surface mb-sm">Evaluation</h4>
<p class="text-body-md text-secondary" th:text="${fiche.evaluationGlobale}"></p>
</div>

</div>
</main>
</div>
</body>
</html>
