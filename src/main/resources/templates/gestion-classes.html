<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gestion des Classes - EduSystem Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<a class="p-2 hover:bg-gray-100 rounded-full transition-colors" th:href="@{/gestion-academique}" title="Retour">
<span class="material-symbols-outlined text-blue-900">arrow_back</span>
</a>
<div>
<h1 class="text-xl font-bold text-blue-900">Gestion des Classes</h1>
<p class="text-gray-500 text-sm">Creer, modifier ou supprimer les classes de l'etablissement.</p>
</div>
</div>
<a class="bg-blue-900 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2" th:href="@{/gestion-classes/nouveau}">
<span class="material-symbols-outlined text-[18px]">add</span> Nouvelle classe
</a>
</header>

<main class="max-w-5xl mx-auto px-8 py-8">

<div th:if="${erreur}" class="mb-lg p-md rounded-lg bg-red-100 text-red-800 font-medium" th:text="${erreur}"></div>
<div th:if="${success}" class="mb-lg p-md rounded-lg bg-green-100 text-green-800 font-medium" th:text="${success}"></div>

<div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
<table class="w-full text-left text-sm">
<thead class="bg-gray-50 text-gray-500 uppercase text-xs">
<tr><th class="px-5 py-3">Nom</th><th class="px-5 py-3">Niveau</th><th class="px-5 py-3">Annee scolaire</th><th class="px-5 py-3">Professeur Titulaire</th><th class="px-5 py-3 text-right">Actions</th></tr>
</thead>
<tbody class="divide-y divide-gray-100">
<tr th:if="${classes.isEmpty()}">
<td class="px-5 py-8 text-center text-gray-500" colspan="5">Aucune classe creee.</td>
</tr>
<tr class="ligne-classe" th:data-annee="${c.anneeScolaire}" th:data-capacite="${c.capacite}" th:data-id="${c.id}" th:data-niveau="${c.niveau}" th:data-nom="${c.nom}" th:data-notes="${c.notes}" th:data-salle="${c.salle}" th:data-titulaire="${c.professeurTitulaireId}" th:each="c : ${classes}">
<td class="px-5 py-3 font-medium" th:text="${c.nom}">Nom</td>
<td class="px-5 py-3 text-gray-500" th:text="${c.niveau}">Niveau</td>
<td class="px-5 py-3 text-gray-500" th:text="${c.anneeScolaire}">Annee</td>
<td class="px-5 py-3 text-gray-500">
<span th:each="e : ${enseignants}" th:if="${c.professeurTitulaireId != null and c.professeurTitulaireId == e.id}" th:text="${e.prenom} + ' ' + ${e.nom}">--</span>
<span th:if="${c.professeurTitulaireId == null}">--</span>
</td>
<td class="px-5 py-3 text-right space-x-2">
<button class="text-blue-900 hover:underline text-xs bouton-modifier" type="button">Modifier</button>
<form class="inline" method="post" th:action="@{/gestion-classes/{id}/supprimer(id=${c.id})}" onsubmit="return confirm('Supprimer cette classe ?');">
<button class="text-red-600 hover:underline text-xs" type="submit">Supprimer</button>
</form>
</td>
</tr>
</tbody>
</table>
</div>

</main>

<div class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-lg" id="modal-classe">
<div class="bg-white rounded-xl p-xl max-w-md w-full">
<div class="flex justify-between items-center mb-lg">
<h3 class="font-bold text-lg" id="modal-titre">Nouvelle classe</h3>
<button onclick="fermerModal()" type="button"><span class="material-symbols-outlined">close</span></button>
</div>
<form class="space-y-3" id="form-classe" method="post" th:action="@{/gestion-classes}">
<div>
<label class="text-xs text-gray-500 block mb-1">Nom</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" id="input-nom" name="nom" required="required" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Niveau</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" id="input-niveau" name="niveau" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Annee scolaire</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" id="input-annee" name="anneeScolaire" placeholder="2025-2026" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Professeur Titulaire</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" id="input-titulaire" name="professeurTitulaireId">
<option value="">-- Aucun --</option>
<option th:each="e : ${enseignants}" th:text="${e.prenom} + ' ' + ${e.nom}" th:value="${e.id}"></option>
</select>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Capacité maximale</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" id="input-capacite" min="1" name="capacite" type="number"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Salle attitrée</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" id="input-salle" name="salle" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Notes</label>
<textarea class="w-full p-2 border border-gray-300 rounded-lg" id="input-notes" name="notes" rows="2"></textarea>
</div>
<div class="flex justify-end gap-2 pt-2">
<button class="px-4 py-2 border border-gray-300 rounded-lg" onclick="fermerModal()" type="button">Annuler</button>
<button class="px-4 py-2 bg-blue-900 text-white rounded-lg" type="submit">Enregistrer</button>
</div>
</form>
</div>
</div>

<script>
    function fermerModal() { document.getElementById('modal-classe').classList.add('hidden'); }
    document.querySelectorAll('.bouton-modifier').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var row = btn.closest('.ligne-classe');
            document.getElementById('modal-titre').textContent = 'Modifier la classe';
            document.getElementById('form-classe').action = '/gestion-classes/' + row.getAttribute('data-id') + '/modifier';
            document.getElementById('input-nom').value = row.getAttribute('data-nom') || '';
            document.getElementById('input-niveau').value = row.getAttribute('data-niveau') || '';
            document.getElementById('input-annee').value = row.getAttribute('data-annee') || '';
            document.getElementById('input-titulaire').value = row.getAttribute('data-titulaire') || '';
            document.getElementById('input-capacite').value = row.getAttribute('data-capacite') || '';
            document.getElementById('input-salle').value = row.getAttribute('data-salle') || '';
            document.getElementById('input-notes').value = row.getAttribute('data-notes') || '';
            document.getElementById('modal-classe').classList.remove('hidden');
        });
    });
</script>
</body>
</html>
