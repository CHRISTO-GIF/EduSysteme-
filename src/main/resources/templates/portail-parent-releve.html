<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Releve Annuel - EduSystem Pro</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { vertical-align: middle; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-gray-100">
<div class="max-w-3xl mx-auto py-6 px-4 sm:py-xl sm:px-lg">
<div class="no-print flex flex-wrap justify-between items-center gap-3 mb-lg">
<a class="flex items-center gap-xs text-primary font-label-md" href="/portail-parent/paiements">
<span class="material-symbols-outlined">arrow_back</span> Retour
</a>
<button class="px-lg py-2 bg-blue-900 text-white rounded-lg font-bold flex items-center gap-xs" onclick="window.print()" type="button">
<span class="material-symbols-outlined">print</span> Imprimer
</button>
</div>

<div class="bg-white rounded-xl border border-gray-200 p-4 sm:p-xl">
<div class="flex flex-col sm:flex-row justify-between items-start gap-3 mb-xl border-b border-gray-200 pb-lg">
<div>
<h1 class="text-2xl font-bold text-blue-900">EduSystem Pro</h1>
<p class="text-gray-500 text-sm">Relevé Annuel des Paiements</p>
</div>
<div class="text-left sm:text-right">
<p class="text-sm text-gray-500">Année</p>
<p class="font-bold" th:text="${anneeCourante}">2026</p>
</div>
</div>

<div class="mb-lg">
<p class="text-sm text-gray-500">Enfant(s) concerné(s)</p>
<p class="font-medium" th:each="e : ${enfants}" th:text="${e.prenom} + ' ' + ${e.nom}"></p>
</div>

<div class="overflow-x-auto -mx-4 px-4 sm:mx-0 sm:px-0">
<table class="w-full text-left text-sm mb-lg min-w-[560px]">
<thead class="bg-gray-50 text-gray-500 uppercase text-xs">
<tr>
<th class="px-md py-sm">Date</th>
<th class="px-md py-sm">Désignation</th>
<th class="px-md py-sm">Enfant</th>
<th class="px-md py-sm">Mode</th>
<th class="px-md py-sm">Reçu N&#176;</th>
<th class="px-md py-sm text-right">Montant</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-100">
<tr th:if="${paiements.isEmpty()}">
<td class="px-md py-lg text-center text-gray-500" colspan="6">Aucun paiement enregistré.</td>
</tr>
<tr th:each="p : ${paiements}">
<td class="px-md py-sm" th:text="${#temporals.format(p.datePaiement, 'dd/MM/yyyy')}">--</td>
<td class="px-md py-sm" th:text="${p.fraisScolarite != null ? p.fraisScolarite.designation : p.typePaiement}">Designation</td>
<td class="px-md py-sm" th:text="${p.eleve != null ? p.eleve.prenom + ' ' + p.eleve.nom : '?'}">Enfant</td>
<td class="px-md py-sm" th:text="${p.modePaiement}">Mode</td>
<td class="px-md py-sm" th:text="${p.recuNumero}">Recu</td>
<td class="px-md py-sm text-right font-medium" th:text="${#numbers.formatDecimal(p.montantVerse, 0, 'COMMA', 0, 'POINT')} + ' F'">0 F</td>
</tr>
</tbody>
<tfoot>
<tr class="border-t-2 border-gray-300 font-bold">
<td class="px-md py-md" colspan="5">Total réglé</td>
<td class="px-md py-md text-right" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' F'">0 F</td>
</tr>
</tfoot>
</table>
</div>

<p class="text-xs text-gray-400 mt-xl">Document généré automatiquement depuis le Portail Parent EduSystem Pro.</p>
</div>
</div>
</body>
</html>
