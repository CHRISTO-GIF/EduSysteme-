<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro - Suivi Pedagogique (Direction)</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="bg-background text-gray-900">
<header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
<div>
<h1 class="text-xl font-bold text-blue-900">Suivi Pedagogique</h1>
<p class="text-gray-500 text-sm">Vue Direction — progression de la saisie des notes par enseignant.</p>
</div>
<a class="flex items-center gap-2 text-blue-900 font-medium text-sm" href="/dashboard">
<span class="material-symbols-outlined">arrow_back</span> Retour au tableau de bord
</a>
</header>

<main class="max-w-7xl mx-auto px-8 py-8">

<form class="bg-white border border-gray-200 rounded-xl p-lg mb-lg flex flex-wrap gap-md items-end" method="get">
<div>
<label class="text-xs text-gray-500 block mb-1">Enseignant</label>
<input class="p-2 border border-gray-300 rounded-lg" name="filtreEnseignant" placeholder="Nom..." th:value="${filtreEnseignant}" type="text"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Matiere</label>
<select class="p-2 border border-gray-300 rounded-lg" name="filtreMatiere">
<option value="">Toutes</option>
<option th:each="m : ${matieres}" th:selected="${filtreMatiere != null and filtreMatiere == m.id}" th:text="${m.nom}" th:value="${m.id}"></option>
</select>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Classe</label>
<select class="p-2 border border-gray-300 rounded-lg" name="filtreClasse">
<option value="">Toutes</option>
<option th:each="c : ${classes}" th:selected="${filtreClasse != null and filtreClasse == c.id}" th:text="${c.nom}" th:value="${c.id}"></option>
</select>
</div>
<button class="bg-blue-900 text-white px-lg py-2 rounded-lg font-medium" type="submit">Filtrer</button>
<a class="text-gray-500 text-sm" href="/direction/suivi">Reinitialiser</a>
</form>

<div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
<table class="w-full text-left text-sm">
<thead class="bg-gray-50 text-gray-500 uppercase text-xs">
<tr>
<th class="px-5 py-3">Enseignant</th>
<th class="px-5 py-3">Matiere</th>
<th class="px-5 py-3">Classe</th>
<th class="px-5 py-3">Derniere saisie</th>
<th class="px-5 py-3">Eleves notes</th>
<th class="px-5 py-3">Statut</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-100">
<tr th:if="${suiviRows.isEmpty()}">
<td class="px-5 py-8 text-center text-gray-500" colspan="6">Aucune autorisation d'enseignement trouvee pour ces filtres.</td>
</tr>
<tr th:each="row : ${suiviRows}">
<td class="px-5 py-3 font-medium" th:text="${row.enseignantNom}">Nom</td>
<td class="px-5 py-3" th:text="${row.matiereNom}">Matiere</td>
<td class="px-5 py-3" th:text="${row.classeNom}">Classe</td>
<td class="px-5 py-3 text-gray-500" th:text="${row.derniereSaisie != null} ? ${#temporals.format(row.derniereSaisie, 'dd/MM/yyyy HH:mm')} : '--'">--</td>
<td class="px-5 py-3" th:text="${row.nbElevesSaisies} + ' / ' + ${row.totalEleves}">0 / 0</td>
<td class="px-5 py-3">
<span class="px-2 py-0.5 rounded-full text-xs font-medium"
      th:classappend="${row.statut == 'COMPLET'} ? 'bg-green-100 text-green-800' : (${row.statut == 'EN_COURS'} ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800')"
      th:text="${row.statut == 'COMPLET'} ? 'Complet' : (${row.statut == 'EN_COURS'} ? 'En cours' : 'Non rempli')">Statut</span>
</td>
</tr>
</tbody>
</table>
</div>

</main>
</body>
</html>
