<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro | Enseignant cree</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
<div class="w-full max-w-lg bg-white border border-[#e2e8f0] rounded-xl shadow-sm p-8">
<div class="flex flex-col items-center mb-8 text-center">
<span class="material-symbols-outlined text-[#00236f] text-[48px] mb-2" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<h1 class="text-2xl font-bold text-[#00236f]">Enseignant ajoute avec succes</h1>
<p class="text-sm text-[#505f76] mt-2" th:text="'Le profil de ' + ${nomComplet} + ' a ete cree, avec un acces au portail enseignant.'"></p>
</div>

<div class="space-y-4">
<div class="p-4 rounded-lg bg-[#f2f4f6] border border-[#e2e8f0]">
<p class="text-xs font-semibold text-[#444651] uppercase tracking-wider mb-1">ID Employe</p>
<p class="text-lg font-bold text-[#00236f]" th:text="${codeAcces}"></p>
</div>
<div class="p-4 rounded-lg bg-[#f2f4f6] border border-[#e2e8f0]">
<p class="text-xs font-semibold text-[#444651] uppercase tracking-wider mb-1">Identifiant de connexion</p>
<p class="text-base text-[#191c1e]" th:text="${adminEmail}"></p>
</div>
<div class="p-4 rounded-lg bg-[#d0e1fb] border border-[#c5c5d3]">
<p class="text-xs font-semibold text-[#54647a] uppercase tracking-wider mb-1">Mot de passe temporaire</p>
<p class="text-lg font-bold text-[#00236f]" th:text="${motDePasse}"></p>
<p class="text-xs text-[#54647a] mt-2">Notez-le des maintenant : il ne sera plus affiche apres cette page. Transmettez-le a l'enseignant et invitez-le a le changer.</p>
</div>
</div>

<div class="flex gap-3 mt-8">
<a class="flex-1 text-center border border-[#c5c5d3] text-[#00236f] font-semibold h-12 rounded-lg hover:bg-[#f2f4f6] transition-all flex items-center justify-center" href="/personnel">Retour a l'annuaire</a>
<a class="flex-1 text-center bg-[#00236f] text-white font-semibold h-12 rounded-lg hover:opacity-90 transition-all flex items-center justify-center" href="/personnel/nouveau">Ajouter un autre</a>
</div>
</div>
</body>
</html>
