<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro - Configurer le Bareme</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-lg">
<div class="w-full max-w-2xl bg-white border border-[#c5c5d3] rounded-xl shadow-sm p-4 md:p-8">
<div class="mb-6">
<p class="text-xs uppercase tracking-wider text-[#757682] font-bold mb-1">Configuration du bareme</p>
<h1 class="text-2xl font-bold text-[#00236f]" th:text="${examen.matiere != null ? examen.matiere.nom : 'Examen'} + ' — ' + (${examen.classe != null ? examen.classe.nom : ''})">Examen</h1>
<p class="text-sm text-[#444651] mt-1">Definissez les questions et leur bareme avant de commencer la correction.</p>
</div>

<div th:if="${successMsg}" class="mb-4 p-3 rounded-lg bg-[#c8f7d4] text-[#0a5c2b] text-sm" th:text="${successMsg}"></div>

<form method="post" th:action="@{/examens/{id}/bareme(id=${examen.id})}">
<div class="space-y-3" id="questions-container">
<div class="grid grid-cols-1 sm:grid-cols-12 gap-2 sm:items-center question-row" th:each="q, iter : ${questions}">
<input class="sm:col-span-5 p-2 border border-[#c5c5d3] rounded-lg text-sm" name="titre" placeholder="Ex: Question 1" th:value="${q.titre}" type="text"/>
<input class="sm:col-span-4 p-2 border border-[#c5c5d3] rounded-lg text-sm" name="sousTitre" placeholder="Ex: Theorie & Concepts" th:value="${q.sousTitre}" type="text"/>
<div class="flex items-center gap-2">
<input class="flex-1 sm:col-span-2 p-2 border border-[#c5c5d3] rounded-lg text-sm text-center" min="0" name="bareme" step="0.5" th:value="${q.bareme}" type="number"/>
<button class="sm:col-span-1 text-[#ba1a1a] shrink-0" onclick="this.closest('.question-row').remove()" type="button">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-12 gap-2 sm:items-center question-row" th:if="${questions.isEmpty()}">
<input class="sm:col-span-5 p-2 border border-[#c5c5d3] rounded-lg text-sm" name="titre" placeholder="Ex: Question 1" type="text"/>
<input class="sm:col-span-4 p-2 border border-[#c5c5d3] rounded-lg text-sm" name="sousTitre" placeholder="Ex: Theorie & Concepts" type="text"/>
<div class="flex items-center gap-2">
<input class="flex-1 sm:col-span-2 p-2 border border-[#c5c5d3] rounded-lg text-sm text-center" min="0" name="bareme" step="0.5" type="number" value="5"/>
<button class="sm:col-span-1 text-[#ba1a1a] shrink-0" onclick="this.closest('.question-row').remove()" type="button">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</div>
<button class="mt-4 px-4 py-2 border border-[#c5c5d3] rounded-lg text-sm font-bold text-[#00236f] hover:bg-[#f2f4f6] transition-colors flex items-center gap-1" onclick="ajouterQuestion()" type="button">
<span class="material-symbols-outlined text-[18px]">add</span> Ajouter une question
</button>

<div class="flex justify-end gap-2 pt-6 mt-6 border-t border-[#c5c5d3]">
<a class="px-5 py-2 border border-[#c5c5d3] rounded-lg text-sm font-bold" th:href="@{/examens}">Annuler</a>
<button class="px-5 py-2 bg-[#00236f] text-white rounded-lg text-sm font-bold" type="submit">Enregistrer le bareme</button>
</div>
</form>
</div>

<script>
        function ajouterQuestion() {
            const container = document.getElementById('questions-container');
            const row = document.createElement('div');
            row.className = 'grid grid-cols-1 sm:grid-cols-12 gap-2 sm:items-center question-row';
            row.innerHTML = `
                <input type="text" name="titre" placeholder="Ex: Question" class="sm:col-span-5 p-2 border border-[#c5c5d3] rounded-lg text-sm"/>
                <input type="text" name="sousTitre" placeholder="Ex: Sous-titre" class="sm:col-span-4 p-2 border border-[#c5c5d3] rounded-lg text-sm"/>
                <div class="flex items-center gap-2">
                <input type="number" name="bareme" value="5" min="0" step="0.5" class="flex-1 sm:col-span-2 p-2 border border-[#c5c5d3] rounded-lg text-sm text-center"/>
                <button type="button" class="sm:col-span-1 text-[#ba1a1a] shrink-0" onclick="this.closest('.question-row').remove()">
                    <span class="material-symbols-outlined">delete</span>
                </button>
                </div>
            `;
            container.appendChild(row);
        }
    </script>
</body>
</html>
