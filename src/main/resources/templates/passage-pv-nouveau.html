<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro - Nouveau Proces-Verbal</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<script id="tailwind-config" th:inline="javascript">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#dae2fd", "primary-fixed-dim": "#b6c4ff", "tertiary": [[${accentColor}]],
                    "on-primary-fixed-variant": "#264191", "surface-container-low": "#f2f4f6", "surface-container": "#eceef0",
                    "surface-container-highest": "#e0e3e5", "surface-container-lowest": "#ffffff", "surface": "#f7f9fb",
                    "outline-variant": "#c5c5d3", "primary": "#00236f", "on-background": "#191c1e",
                    "surface-bright": "#f7f9fb", "error-container": "#ffdad6", "surface-variant": "#e0e3e5",
                    "background": "#f7f9fb", "primary-fixed": "#dce1ff", "on-surface": "#191c1e",
                    "on-error-container": "#93000a", "tertiary-container": "#384055", "secondary": "#505f76",
                    "on-primary": "#ffffff", "error": "#ba1a1a", "on-tertiary-container": "#a4acc5",
                    "secondary-container": "#d0e1fb", "primary-container": "#1e3a8a", "surface-dim": "#d8dadc",
                    "on-surface-variant": "#444651", "on-secondary-container": "#54647a", "surface-container-high": "#e6e8ea",
                    "outline": "#757682", "on-error": "#ffffff", "success": "#15803d", "success-container": "#dcfce7"
            },
            "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            "spacing": {"sidebar-width": "260px", "base": "4px", "lg": "24px", "xs": "4px", "xl": "32px", "gutter": "24px", "md": "16px", "container-max": "1440px", "sm": "8px"},
            "fontFamily": {"headline-sm": ["Inter"], "body-lg": ["Inter"], "code": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"], "label-md": ["Inter"], "headline-md": ["Inter"]},
            "fontSize": {
                    "headline-sm": ["18px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "code": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface">
<div th:replace="~{fragments/sidebar-admin :: admin('passage')}"></div>

<main class="ml-sidebar-width min-h-screen flex flex-col">
<header class="sticky top-0 z-40 bg-surface border-b border-outline-variant flex justify-between items-center h-16 px-gutter">
<div class="flex items-center text-on-surface-variant font-label-sm text-label-sm">
<a class="hover:underline" th:href="@{/passage}">Passage de classe</a>
<span class="material-symbols-outlined text-[16px] mx-2">chevron_right</span>
<span class="text-primary font-bold">Nouveau proces-verbal</span>
</div>
</header>

<div class="flex-1 p-gutter max-w-[900px] mx-auto w-full">
<div class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-primary">Générer un procès-verbal</h2>
<p class="text-on-surface-variant font-body-md text-body-md">Optionnel — pour un conseil de classe trimestriel ou la délibération de fin d'année, sur une ou plusieurs classes.</p>
</div>

<div th:if="${erreurMsg}" class="mb-lg p-md rounded-lg bg-error-container text-error font-body-md text-body-md" th:text="${erreurMsg}"></div>

<form class="bg-white border border-outline-variant rounded-xl shadow-sm p-lg space-y-lg" method="post" th:action="@{/passage/pv/nouveau}">

<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Session</label>
<select class="rounded-lg border-outline-variant px-md py-sm font-body-md text-body-md" name="trimestre">
<option value="">Délibération de fin d'année</option>
<option value="1">1er Trimestre</option>
<option value="2">2e Trimestre</option>
<option value="3">3e Trimestre</option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Date de la séance</label>
<input class="rounded-lg border-outline-variant px-md py-sm font-body-md text-body-md" name="dateSeance" required="required" type="date"/>
</div>
</div>

<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Rapporteur (secrétaire de séance)</label>
<input class="rounded-lg border-outline-variant px-md py-sm font-body-md text-body-md" name="rapporteurNom" placeholder="Nom complet" required="required" type="text"/>
</div>

<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant">Classe(s) concernée(s)</label>
<label class="flex items-center gap-xs text-label-sm text-secondary">
<input id="toutes-classes" onchange="document.querySelectorAll('.classe-checkbox').forEach(function(c){c.checked=this.checked;}.bind(this))" type="checkbox"/> Toutes les classes
</label>
</div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-sm p-md bg-surface-container-low rounded-lg max-h-60 overflow-y-auto">
<label class="flex items-center gap-xs font-body-md text-body-md" th:each="c : ${classes}">
<input class="classe-checkbox" name="classeIds" th:value="${c.id}" type="checkbox"/> <span th:text="${c.nom}"></span>
</label>
</div>
</div>

<button class="w-full bg-primary text-on-primary font-label-md text-label-md px-lg py-sm rounded-lg hover:opacity-90 transition-all flex items-center justify-center gap-xs" type="submit">
<span class="material-symbols-outlined text-[20px]">groups</span> Constituer le jury
</button>
</form>
</div>
</main>
</body>
</html>
