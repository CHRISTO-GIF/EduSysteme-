<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Barre laterale desktop partagee par les pages "back-office" (ADMIN et roles
  associes). Un seul point de verite pour la liste des destinations et les
  droits d'acces par role — evite que chaque page ne reimplante sa propre
  copie (incomplete) de la navigation.
  Usage : <div th:replace="~{fragments/sidebar-admin :: admin('personnel')}"></div>
  activePage : identifiant de la page courante parmi les valeurs utilisees
  ci-dessous (dashboard, gestion-academique, matieres, secretariat, cartes,
  personnel, inventaire, emploi-du-temps, notes, examens, bulletins,
  surveillance, messagerie, finances, coordination, journal, parametres).
-->
<aside th:fragment="admin(activePage)" class="hidden md:flex w-sidebar-width h-screen fixed left-0 top-0 bg-tertiary dark:bg-tertiary-container flex-col py-lg z-50">
<div class="px-lg mb-xl">
<h1 class="font-headline-sm text-headline-sm text-on-primary-fixed font-bold">EduSystem Pro</h1>
<p class="text-on-tertiary-container font-label-sm text-label-sm opacity-80" th:text="${nomEtablissement != null ? nomEtablissement : 'Portail Admin'}">Portail Admin</p>
</div>
<nav class="flex-grow overflow-y-auto hide-scrollbar">
<div th:replace="~{fragments/nav-links-admin :: links(activePage)}"></div>
</nav>
<div class="mt-auto px-lg border-t border-tertiary-container/30 pt-lg space-y-xs">
<a class="flex items-center py-sm gap-md text-on-tertiary-container hover:text-on-tertiary transition-colors duration-200" th:if="${utilisateurConnecte != null and utilisateurConnecte.role == 'ADMIN'}" href="/parametres">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md">Parametres</span>
</a>
<a class="flex items-center py-sm gap-md text-on-tertiary-container hover:text-on-tertiary transition-colors duration-200" href="#" onclick="document.getElementById('logout-form').submit(); return false;">
<span class="material-symbols-outlined">logout</span>
<span class="font-label-md text-label-md">Deconnexion</span>
</a>
<form id="logout-form" method="post" th:action="@{/logout}" style="display:none"></form>
</div>
</aside>
</body>
</html>
